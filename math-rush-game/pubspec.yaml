name: math_rush
description: "Math Rush - A fast-paced math quiz game with timer and score system"
publish_to: 'none'

# গেমের version — Play Store এ প্রতিবার update দিলে বাড়াতে হবে
# version: major.minor.patch+buildNumber
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local storage — high score সেভ করার জন্য
  shared_preferences: ^2.2.3

  # Icons pack — সুন্দর icon এর জন্য
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # পরে আলাদা ছবি/font যোগ করলে এখানে দিতে হবে
  # assets:
  #   - assets/images/
